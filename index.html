<script>
{
/*LOGIC-START*/
const round = (x, d) => { const k = 10 ** d; return Math.round(x * k) / k; };

function holdings(assets, txs) {
  const h = {};
  for (const a of assets) h[a.id] = { qty: 0, cost: 0 };
  const sorted = [...txs].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  for (const t of sorted) {
    const x = h[t.assetId]; if (!x) continue;
    const q = Number(t.qty) || 0, p = Number(t.price) || 0, f = Number(t.fees) || 0;
    if (t.side === 'vente') {
      const avg = x.qty > 0 ? x.cost / x.qty : 0;
      x.cost -= avg * Math.min(q, x.qty); x.qty -= q;
    } else { x.qty += q; x.cost += q * p + f; }
  }
  return h;
}

function peaInvested(assets, txs) {
  const pea = new Set(assets.filter(a => a.account === 'PEA').map(a => a.id));
  return txs.filter(t => pea.has(t.assetId) && t.side !== 'vente')
    .reduce((s, t) => s + (Number(t.qty) || 0) * (Number(t.price) || 0) + (Number(t.fees) || 0), 0);
}

function computePlan(cfg, txs, budget) {
  const { classes, assets, settings } = cfg;
  const warnings = [];
  const h = holdings(assets, txs);
  const val = a => (h[a.id]?.qty || 0) * (Number(a.price) || 0);
  const classVal = {}; for (const c of classes) classVal[c.id] = 0;
  for (const a of assets) if (a.classId in classVal) classVal[a.classId] += val(a);
  const V = Object.values(classVal).reduce((s, v) => s + v, 0);
  const B = Math.max(0, Number(budget) || 0);
  const T = V + B;
  const sumW = classes.reduce((s, c) => s + (Number(c.target) || 0), 0);
  if (Math.abs(sumW - 100) > 0.01) warnings.push(`Les poids cibles totalisent ${round(sumW, 2)} % au lieu de 100 %.`);
  const def = {}; let sumDef = 0;
  for (const c of classes) { def[c.id] = Math.max(0, (Number(c.target) || 0) / 100 * T - classVal[c.id]); sumDef += def[c.id]; }
  const alloc = {};
  for (const c of classes) {
    alloc[c.id] = sumDef >= B
      ? (sumDef > 0 ? def[c.id] * B / sumDef : 0)
      : def[c.id] + (B - sumDef) * (sumW > 0 ? (Number(c.target) || 0) / sumW : 0);
  }
  const cap = Number(settings.peaCap) || 150000;
  let peaUsed = peaInvested(assets, txs);
  const frac = acc => acc === 'PEA' ? !!settings.fracPEA : !!settings.fracCTO;
  const minLine = Number(settings.minLine) || 0;
  let pool = 0; const lines = [];
  const order = [...classes].sort((a, b) => alloc[b.id] - alloc[a.id]);
  for (const c of order) {
    const amt = alloc[c.id];
    if (amt <= 0.005) continue;
    const inClass = assets.filter(a => a.classId === c.id && Number(a.price) > 0);
    if (!inClass.length) { warnings.push(`Aucun actif avec un cours pour « ${c.name} » : ${round(amt, 2)} € reportés sur les autres classes.`); pool += amt; continue; }
    let asset = inClass.find(a => a.account === 'PEA' && peaUsed + amt <= cap) || inClass.find(a => a.account === 'CTO');
    if (!asset) { warnings.push(`Plafond PEA atteint et aucun actif CTO pour « ${c.name} » : montant reporté sur les autres classes.`); pool += amt; continue; }
    const p = Number(asset.price);
    let qty = 0;
    if (amt >= minLine) qty = frac(asset.account) ? Math.floor(amt / p * 10000) / 10000 : Math.floor(amt / p);
    const cost = qty * p;
    pool += amt - cost;
    if (asset.account === 'PEA') peaUsed += cost;
    lines.push({ classId: c.id, className: c.name, assetId: asset.id, assetName: asset.name, account: asset.account, price: p, qty, frac: frac(asset.account) });
  }
  // Montant non placé : ouvrir des lignes sur les autres classes plaçables
  if (pool >= Math.max(minLine, 0.01)) {
    for (const c of classes) {
      if (lines.some(l => l.classId === c.id)) continue;
      const inClass = assets.filter(a => a.classId === c.id && Number(a.price) > 0);
      const asset = inClass.find(a => a.account === 'PEA' && peaUsed + pool <= cap) || inClass.find(a => a.account === 'CTO');
      if (asset) lines.push({ classId: c.id, className: c.name, assetId: asset.id, assetName: asset.name, account: asset.account, price: Number(asset.price), qty: 0, frac: frac(asset.account) });
    }
  }
  // Reliquat : parts entières supplémentaires vers les classes les plus en retard
  const gap = l => (Number(classes.find(c => c.id === l.classId).target) || 0) / 100 * T - classVal[l.classId] - l.qty * l.price;
  let moved = true;
  while (moved && pool > 0.005) {
    moved = false;
    const cands = lines.filter(l => !l.frac && l.price <= pool + 1e-9).sort((a, b) => gap(b) - gap(a));
    if (cands.length) { const l = cands[0]; l.qty += 1; pool -= l.price; moved = true; continue; }
    const fl = lines.filter(l => l.frac).sort((a, b) => gap(b) - gap(a))[0];
    if (fl) { const add = Math.floor(pool / fl.price * 10000) / 10000; if (add > 0) { fl.qty = round(fl.qty + add, 4); pool -= add * fl.price; moved = true; } }
  }
  const used = lines.reduce((s, l) => s + l.qty * l.price, 0);
  return { lines: lines.filter(l => l.qty > 0), used: round(used, 2), left: round(B - used, 2), V, warnings };
}

function valueHistory(assets, txs, prices) {
  const dates = new Set();
  for (const a of assets) for (const d of Object.keys((prices[a.id] || {}))) dates.add(d);
  const days = [...dates].sort();
  const sorted = [...txs].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  return days.map(d => {
    const h = holdings(assets, sorted.filter(t => (t.date || '') <= d));
    let value = 0, cost = 0, missing = false;
    for (const a of assets) {
      const ph = prices[a.id] || {}; let p = null;
      for (const k of Object.keys(ph).sort()) { if (k <= d) p = Number(ph[k]); else break; }
      if ((h[a.id]?.qty || 0) > 0 && !p) missing = true;
      value += (h[a.id]?.qty || 0) * (p || 0); cost += h[a.id]?.cost || 0;
    }
    return { d, value, cost, missing };
  }).filter(x => x.cost > 0 && !x.missing);
}

const normName = x => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function nameScore(a, b) {
  const STOP = new Set(['amundi', 'ishares', 'bnp', 'paribas', 'easy', 'pea', 'ucits', 'etf', 'acc', 'dist', 'eur', 'usd', 'capitalisation', 'the', 'de', 'la', 'le', 'du', 'fund', 'sa', 'inc', 'plc', 'nv', 'se']);
  const words = x => normName(x).split(' ').filter(w => w.length > 1 && !STOP.has(w));
  const A = new Set(words(a)), B = new Set(words(b));
  if (!A.size || !B.size) return 0; let n = 0; for (const w of A) if (B.has(w)) n++;
  return n / Math.min(A.size, B.size);
}
// lines: [{name, isin, qty, pru, price}] lues sur la capture d'un compte
function diffCapture(assets, txs, account, lines, date) {
  const h = holdings(assets, txs), ops = [], used = new Set();
  for (const l of lines) {
    const qty = Number(l.qty) || 0, pru = Number(l.pru) || 0, price = Number(l.price) || 0;
    let best = null, sc = 0;
    for (const a of assets) {
      if (a.account !== account || used.has(a.id)) continue;
      const s = l.isin && a.isin && String(l.isin).toUpperCase() === String(a.isin).toUpperCase() ? 2 : nameScore(l.name, a.name);
      if (s > sc) { sc = s; best = a; }
    }
    if (!best || sc < 0.6) { ops.push({ kind: 'new', name: l.name, isin: l.isin || '', qty, pru, price }); continue; }
    used.add(best.id);
    const old = h[best.id] || { qty: 0, cost: 0 }, dq = Math.round((qty - old.qty) * 10000) / 10000;
    if (dq > 0) ops.push({ kind: 'buy', assetId: best.id, name: best.name, qty: dq, price: Math.round((qty * pru - old.cost) / dq * 10000) / 10000, date });
    else if (dq < 0) ops.push({ kind: 'sell', assetId: best.id, name: best.name, qty: -dq, price: price || Number(best.price) || 0, date });
    if (price > 0 && price !== Number(best.price)) ops.push({ kind: 'price', assetId: best.id, name: best.name, price, date });
  }
  for (const a of assets) if (a.account === account && !used.has(a.id) && (h[a.id]?.qty || 0) > 0)
    ops.push({ kind: 'sell', assetId: a.id, name: a.name, qty: h[a.id].qty, price: Number(a.price) || 0, date, missing: true });
  return ops;
}

// Projection : versements mensuels, rendement annuel composé mensuellement
function project({ start, monthly, years, rate, growth = 0 }) {
  const rm = Math.pow(1 + rate / 100, 1 / 12) - 1, pts = [{ y: 0, value: start, paid: start }];
  let v = start, paid = start, m = monthly;
  for (let y = 1; y <= years; y++) {
    for (let k = 0; k < 12; k++) { v = v * (1 + rm) + m; paid += m; }
    pts.push({ y, value: v, paid });
    m *= 1 + growth / 100;
  }
  return pts;
}
/*LOGIC-END*/

const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
function deepMerge(a, b) { const o = { ...(isObj(a) ? a : {}) }; for (const [k, v] of Object.entries(b)) o[k] = isObj(v) && isObj(o[k]) ? deepMerge(o[k], v) : v; return o; }

function makeDb(sb) {
  const parent = p => p.split('/').slice(0, -1).join('/');
  const META = { hasPendingWrites: false, fromCache: false };
  const err = e => ({ code: 'unavailable', message: e?.message || String(e) });
  const listeners = new Set();
  const notify = p => { for (const l of listeners) if (l.match(p)) l.refresh(); };
  sb.channel('docs-' + Math.random().toString(36).slice(2)).on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, pl => notify(pl.new?.path || pl.old?.path || '')).subscribe();
  setInterval(() => { if (!document.hidden) for (const l of listeners) l.refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) for (const l of listeners) l.refresh(); });
  const fetchDoc = async p => { const { data, error } = await sb.from('docs').select('data').eq('path', p).maybeSingle(); if (error) throw err(error); return data; };
  const put = async (p, data) => { const { error } = await sb.from('docs').upsert({ path: p, col: parent(p), id: p.split('/').pop(), data }); if (error) throw err(error); notify(p); };
  function doc(path) {
    return {
      id: path.split('/').pop(), path,
      async get() { const r = await fetchDoc(path); return { id: this.id, exists: !!r, data: () => r?.data, metadata: META }; },
      set: data => put(path, data),
      async update(data) { const r = await fetchDoc(path); if (!r) throw { code: 'invalid_argument', message: 'missing' }; await put(path, deepMerge(r.data, data)); },
      async delete() { const { error } = await sb.from('docs').delete().eq('path', path); if (error) throw err(error); notify(path); },
      onSnapshot(next, onErr) {
        const l = { match: p => p === path, refresh: async () => { try { const r = await fetchDoc(path); next({ id: path.split('/').pop(), exists: !!r, data: () => r?.data, metadata: META }); } catch (e) { onErr && onErr(e); } } };
        listeners.add(l); l.refresh(); return () => listeners.delete(l);
      },
      collection: sub => collection(path + '/' + sub)
    };
  }
  function collection(col, q = { filters: [], order: null, lim: null }) {
    const run = async () => {
      let r = sb.from('docs').select('id,data').eq('col', col);
      for (const [f, op, v] of q.filters) if (op === '==') r = r.eq('data->>' + f, String(v));
      if (q.order) r = r.order('data->>' + q.order[0], { ascending: q.order[1] !== 'desc' });
      if (q.lim) r = r.limit(q.lim);
      const { data, error } = await r; if (error) throw err(error);
      const docs = data.map(x => ({ id: x.id, exists: true, data: () => x.data, metadata: META }));
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: META };
    };
    return {
      path: col,
      where: (f, op, v) => collection(col, { ...q, filters: [...q.filters, [f, op, v]] }),
      orderBy: (f, d) => collection(col, { ...q, order: [f, d] }),
      limit: n => collection(col, { ...q, lim: n }),
      get: run,
      doc: id => doc(col + '/' + (id || uid())),
      add: async data => { const d = doc(col + '/' + uid()); await d.set(data); return d; },
      onSnapshot(next, onErr) {
        const l = { match: p => parent(p) === col, refresh: async () => { try { next(await run()); } catch (e) { onErr && onErr(e); } } };
        listeners.add(l); l.refresh(); return () => listeners.delete(l);
      }
    };
  }
  return { doc, collection };
}

let ro = null;
function drawHisto() {
  const box = $('#histo'); if (!box) return;
  const pts = valueHistory(cfg.assets, txs, prices);
  if (pts.length < 2) { box.innerHTML = '<p class="note">Le graphique apparaîtra après quelques jours de cours enregistrés.</p>'; return; }
  box.className = 'fig'; box.style.minHeight = '260px';
  box.innerHTML = '<svg role="img" aria-label="Valeur du portefeuille et montant investi dans le temps"></svg>';
  const s = box.firstChild;
  const draw = () => {
    const W = s.clientWidth, H = s.clientHeight, L = W < 520 ? 8 : 64, R = 12, T = 12, B = 28;
    const ys = pts.flatMap(p => [p.value, p.cost]); let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo) * 0.1 || hi * 0.05 || 1; lo -= pad; hi += pad;
    const t0 = Date.parse(pts[0].d), t1 = Date.parse(pts.at(-1).d) || t0 + 1;
    const X = d => L + (Date.parse(d) - t0) / (t1 - t0 || 1) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
    const line = k => pts.map((p, i) => (i ? 'L' : 'M') + X(p.d).toFixed(1) + ' ' + Y(p[k]).toFixed(1)).join('');
    const ticks = W < 520 ? '' : [lo + pad, (lo + hi) / 2, hi - pad].map(v => `<text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="12" fill="var(--mute)">${esc(Math.round(v).toLocaleString('fr-FR'))} €</text><line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>`).join('');
    const last = pts.at(-1);
    s.innerHTML = `${ticks}<path d="${line('cost')}" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="4 4"/><path d="${line('value')}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>
      <text x="${L}" y="${H - 8}" font-size="12" fill="var(--mute)">${esc(pts[0].d)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end" font-size="12" fill="var(--mute)">${esc(last.d)}</text>`;
  };
  ro = new ResizeObserver(draw); ro.observe(s);
  box.insertAdjacentHTML('afterend', '');
}

function stats() {
  const h = holdings(cfg.assets, txs);
  const rows = cfg.assets.map(a => { const x = h[a.id]; const value = x.qty * (Number(a.price) || 0); return { a, qty: x.qty, cost: x.cost, value }; });
  const total = rows.reduce((s, r) => s + r.value, 0), cost = rows.reduce((s, r) => s + r.cost, 0);
  return { rows, total, cost };
}

async function readCapture(files) {
  if (!sample || !files.length) return;
  imp.busy = true; imp.ops = null; imp.msg = 'Claude lit la capture…'; render();
  try {
    const data = await sample.json(`Voici une ou plusieurs captures d'écran d'une application de courtier (compte ${imp.account}). Extrais chaque ligne de position détenue. Réponds uniquement avec un objet JSON : {"positions":[{"name":"nom du titre tel qu'affiché","isin":"ISIN s'il est visible sinon chaîne vide","qty":nombre de parts ou titres,"pru":prix de revient unitaire en euros (null si absent),"price":cours actuel unitaire en euros (null si absent),"value":montant total de la ligne en euros (null si absent),"gain":plus ou moins-value latente en euros (null si absent)}],"cash":solde espèces en euros ou null}. Nombres au format JSON (point décimal). N'invente rien : si une valeur n'est pas visible, mets null. Si la quantité n'est pas affichée mais que le montant et le cours le sont, mets qty à null.`, { images: [...files] });
    const pos = Array.isArray(data?.positions) ? data.positions : [];
    for (const p of pos) {
      if (!(Number(p.qty) > 0) && Number(p.value) > 0 && Number(p.price) > 0) p.qty = Math.round(p.value / p.price * 10000) / 10000;
      if (!(Number(p.pru) > 0) && Number(p.value) > 0 && p.gain != null && Number(p.qty) > 0) p.pru = Math.round((p.value - Number(p.gain)) / p.qty * 10000) / 10000;
    }
    const ok = pos.filter(p => Number(p.qty) > 0);
    imp.ops = diffCapture(cfg.assets, txs, imp.account, ok, today());
    imp.msg = `${ok.length} ligne(s) lue(s)` + (data?.cash != null ? ` · espèces : ${fe(data.cash)}` : '') + (pos.length > ok.length ? ` · ${pos.length - ok.length} ligne(s) sans quantité ignorée(s)` : '') + '.';
  } catch (e) { imp.msg = e?.code === 'invalid_json' ? 'Capture illisible, essaie une image plus nette.' : sErr(e); }
  imp.busy = false; render();
}

  if (!held.length) return [{ lvl: 'info', t: 'Aucune position : ajoute tes achats dans Portefeuille.' }];
  // écart à la cible
  const ctoOnly = c => { const as = cfg.assets.filter(a => a.classId === c.id); return as.length && as.every(a => a.account === 'CTO') && !(Number(c.target) > 0); };
  const base = rows.filter(r => !ctoOnly(cfg.classes.find(c => c.id === r.a.classId) || {})).reduce((s, r) => s + r.value, 0);

function vSet() {
  const sumW = cfg.classes.reduce((s, c) => s + (Number(c.target) || 0), 0);
  const cl = cfg.classes.map(c => `<tr><td><input data-cn="${esc(c.id)}" value="${esc(c.name)}" aria-label="Nom de la classe"></td><td class="n"><input class="sm" data-ct="${esc(c.id)}" type="number" step="any" min="0" max="100" value="${esc(c.target)}" aria-label="Poids cible"></td><td><button class="x" data-delc="${esc(c.id)}">Supprimer</button></td></tr>`).join('');
  const copts = cfg.classes.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  const al = cfg.assets.map(a => `<tr><td><b>${esc(a.name)}</b><br><small style="color:var(--mute)">${esc(a.isin)} ${a.ticker ? '· ' + esc(a.ticker) : ''}</small></td><td><select data-ac="${esc(a.id)}" aria-label="Classe">${cfg.classes.map(c => `<option value="${esc(c.id)}"${c.id === a.classId ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></td><td>${esc(a.account)}</td><td><button class="x" data-dela="${esc(a.id)}">Supprimer</button></td></tr>`).join('');
  const s = cfg.settings;
  return `<h2>Réglages</h2>
  <h3>Répartition cible</h3><p class="sub">Une classe regroupe des actifs interchangeables (ex. « Monde », « Émergents »). Total actuel : <b class="${Math.abs(sumW - 100) < 0.01 ? 'pos' : 'neg'}">${pct(sumW)}</b>.</p>
  ${cfg.classes.length ? `<table><thead><tr><th>Classe</th><th class="n">Cible (%)</th><th></th></tr></thead><tbody>${cl}</tbody></table>` : ''}
  <form class="form" id="fc"><label>Nouvelle classe<input id="cn" required placeholder="Monde"></label><label>Cible (%)<input id="ct" type="number" step="any" min="0" max="100" required></label><button>Ajouter</button></form>
  <h3>Actifs</h3><p class="sub">Renseigne l’ISIN : c’est lui qui sert à retrouver le cours chaque semaine. Dans chaque classe, le calcul choisit d’abord un actif sur le PEA, puis sur le CTO si le plafond est atteint ou s’il n’y a pas d’actif PEA.</p>
  ${cfg.assets.length ? `<div class="scroll"><table class="stack"><thead><tr><th>Actif</th><th>Classe</th><th>Compte</th><th></th></tr></thead><tbody>${al}</tbody></table></div>` : ''}
  ${cfg.classes.length ? `<form class="form" id="fa"><label>Nom<input id="an" required placeholder="Amundi MSCI World"></label><label>ISIN<input id="ai" placeholder="FR0011869353"></label><label>Ticker<input id="at" placeholder="CW8"></label><label>Classe<select id="acl">${copts}</select></label><label>Compte<select id="aac"><option>PEA</option><option>CTO</option></select></label><label>Cours actuel (€)<input id="ap" type="number" step="any" min="0"></label><label>Frais annuels TER (%)<input id="ater" type="number" step="any" min="0" placeholder="0,20"></label><button>Ajouter</button></form>` : '<p class="note">Crée d’abord une classe.</p>'}
  <h3>Paramètres</h3>
  <form class="form" id="fs"><label>Budget mensuel habituel (€)<input id="smb" type="number" min="0" step="any" value="${esc(s.monthlyBudget || '')}"></label><label>Date d’ouverture du PEA<input id="spo" type="date" value="${esc(s.peaOpenDate || '')}"></label><label style="grid-column:1/-1">Ta stratégie, en une ou deux phrases (lue par le conseiller)<input id="sst" value="${esc(s.strategy || '')}" placeholder="PEA : achat mensuel MSCI World. CTO : réservé aux IPO."></label><label>Montant minimum par ligne (€)<input id="sm" type="number" min="0" step="any" value="${esc(s.minLine)}"></label><label>Plafond de versements PEA (€)<input id="sp" type="number" min="0" step="any" value="${esc(s.peaCap)}"></label><label>Fractions de parts sur le PEA<select id="sfp"><option value="0"${s.fracPEA ? '' : ' selected'}>Non</option><option value="1"${s.fracPEA ? ' selected' : ''}>Oui</option></select></label><label>Fractions de parts sur le CTO<select id="sfc"><option value="0"${s.fracCTO ? '' : ' selected'}>Non</option><option value="1"${s.fracCTO ? ' selected' : ''}>Oui</option></select></label><button>Enregistrer</button></form>
  ${STANDALONE ? '<p><button type="button" class="ghost" id="logout">Se déconnecter</button></p>' : ''}
  <p class="note">Outil personnel d’aide au calcul, pas un conseil en investissement.</p>`;
}

const num = id => Number($(id).value);
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target.id;
  if (f === 'fq') { const q = $('#q').value; askQuestion(q); return; }
  if (f === 'fb') { budget = $('#bud').value; plan = computePlan(cfg, txs, budget); render(); }
  if (f === 'fc') { cfg.classes.push({ id: uid(), name: $('#cn').value.trim(), target: num('#ct') }); saveCfg(); render(); }
  if (f === 'fa') { cfg.assets.push({ id: uid(), name: $('#an').value.trim(), isin: $('#ai').value.trim(), ticker: $('#at').value.trim(), classId: $('#acl').value, account: $('#aac').value, ter: $('#ater').value ? num('#ater') : null, price: $('#ap').value ? num('#ap') : null, priceDate: $('#ap').value ? today() : null }); saveCfg(); render(); }
  if (f === 'fs') { cfg.settings = { ...cfg.settings, monthlyBudget: num('#smb') || 0, peaOpenDate: $('#spo').value, strategy: $('#sst').value.trim(), minLine: num('#sm'), peaCap: num('#sp'), fracPEA: $('#sfp').value === '1', fracCTO: $('#sfc').value === '1' }; setStatus('Réglages enregistrés'); saveCfg(); render(); }
  if (f === 'ft') { await addTx({ date: $('#td').value, assetId: $('#ta').value, side: $('#ts').value, qty: num('#tq'), price: num('#tp'), fees: num('#tf') || 0 }); }
  if (f === 'fv' && plan) {
    const d = $('#vd').value || today(), fees = num('#vf') || 0;
    for (const l of plan.lines) if (l.qty > 0) await addTx({ date: d, assetId: l.assetId, side: 'achat', qty: l.qty, price: l.price, fees });
    plan = null; budget = ''; setStatus('Achats enregistrés'); location.hash = '#tableau'; render();
  }
});

async function addTx(t) {
  if (!db) return;
  const id = uid(); t.id = id;
  try { await db.collection('tx').doc(id).set(t); setStatus('Transaction ajoutée'); } catch (e) { setStatus('Erreur : ' + (e?.code || '')); }
}

document.addEventListener('input', e => {
  const k = e.target.dataset?.pk; if (!k || !proj) return;
  proj[k] = Number(e.target.value); if (k === 'start') proj.startAuto = false;
  const f = SL.find(x => x[0] === k); $('#v-' + k).textContent = f[5](proj[k]);
  try { const { startAuto, ...keep } = proj; if (startAuto) delete keep.start; localStorage.setItem('proj', JSON.stringify(keep)); } catch { }
  drawProj();
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (t.id === 'iacc') { imp.account = t.value; imp.ops = null; return; }
  if (t.id === 'ifile') { readCapture(t.files); return; }
  if (d.iop && imp.ops) { imp.ops[d.iop].off = !t.checked; return; }
  if (d.icls && imp.ops) { imp.ops[d.icls].classId = t.value; return; }
  if (d.price) { const a = cfg.assets.find(x => x.id === d.price); if (a) { a.price = t.value === '' ? null : Number(t.value); a.priceDate = today(); saveCfg(); if (a.price > 0 && db) db.doc('prices/' + a.id).set({ h: { ...(prices[a.id] || {}), [today()]: a.price } }).catch(() => {}); render(); } }
  if (d.cn) { const c = cfg.classes.find(x => x.id === d.cn); if (c) { c.name = t.value.trim(); saveCfg(); render(); } }
  if (d.ct) { const c = cfg.classes.find(x => x.id === d.ct); if (c) { c.target = Number(t.value); saveCfg(); render(); } }
  if (d.ac) { const a = cfg.assets.find(x => x.id === d.ac); if (a) { a.classId = t.value; saveCfg(); } }
  if (d.pq && plan) { plan.lines[d.pq].qty = Number(t.value) || 0; render(); }
  if (d.pp && plan) { plan.lines[d.pp].price = Number(t.value) || 0; render(); }
});

const pending = {};
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'askadv') { askAdvice(); return; }
  if (b.id === 'stopask') { askCtl?.abort(); return; }
  if (b.id === 'logout' && sbClient) { await sbClient.auth.signOut(); location.reload(); return; }
  if (b.dataset.preset && proj) { proj.rate = Number(b.dataset.preset); const i = document.querySelector('[data-pk="rate"]'); if (i) i.value = proj.rate; $('#v-rate').textContent = pct(proj.rate); try { const { startAuto, ...keep } = proj; if (startAuto) delete keep.start; localStorage.setItem('proj', JSON.stringify(keep)); } catch { } drawProj(); return; }
  if (b.dataset.forget != null) { memo.splice(Number(b.dataset.forget), 1); saveMemo(); render(); return; }
  if (b.dataset.dismiss) { alerts = alerts.map(a => a.id === b.dataset.dismiss ? { ...a, dismissed: true } : a); db && db.doc('alerts/' + b.dataset.dismiss).update({ dismissed: true }).catch(() => {}); render(); return; }
  if (b.id === 'iapply') { b.disabled = true; applyImport(); return; }
  if (b.id === 'icancel') { imp.ops = null; imp.msg = ''; render(); return; }
  const d = b.dataset; const key = d.delc || d.dela || d.deltx; if (!key) return;
  if (pending[key] !== true) { pending[key] = true; b.textContent = 'Confirmer ?'; setTimeout(() => { if (pending[key]) { delete pending[key]; b.textContent = 'Supprimer'; } }, 3000); return; }
  delete pending[key];
  if (d.delc) { cfg.classes = cfg.classes.filter(c => c.id !== d.delc); saveCfg(); render(); }
  if (d.dela) { cfg.assets = cfg.assets.filter(a => a.id !== d.dela); saveCfg(); render(); }
  if (d.deltx) { try { await db.collection('tx').doc(d.deltx).delete(); } catch (err) { setStatus('Erreur : ' + (err?.code || '')); } }
});

window.addEventListener('hashchange', render);
render();

(async () => {
  const timer = setTimeout(() => { if (!ready) setStatus('Données injoignables pour le moment.'); }, 10000);
  if (!STANDALONE) claude.use('sample').then(sm => { sample = sm; if (['conseiller', 'portefeuille'].includes(route())) render(); });
  db = STANDALONE ? await standaloneDb() : await claude.use('db');
  if (!db) { clearTimeout(timer); ready = true; setStatus(STANDALONE ? 'Données injoignables.' : 'Sauvegarde indisponible : connecte-toi à claude.ai.'); render(); return; }
  let gotCfg = false, gotTx = false;
  const done = () => { if (gotCfg && gotTx && !ready) { ready = true; clearTimeout(timer); setStatus('À jour'); } render(); };
  db.doc('pf/config').onSnapshot(s => {
    if (s.metadata.hasPendingWrites && gotCfg) return;
    const d = s.exists ? s.data() : null;
    cfg = d ? { ...structuredClone(DEFAULT), ...JSON.parse(JSON.stringify(d)) } : structuredClone(DEFAULT);
    cfg.settings = { ...DEFAULT.settings, ...(cfg.settings || {}) };
    gotCfg = true; if (document.activeElement?.tagName !== 'INPUT') done(); else if (!ready) done();
  }, err => { clearTimeout(timer); setStatus('Erreur : ' + err.code); });
  db.collection('prices').onSnapshot(s => { prices = {}; for (const x of s.docs) prices[x.id] = (x.data() || {}).h || {}; if (route() === 'tableau' && ready) drawHisto(); }, () => {});
  db.doc('agent/chat').onSnapshot(s => { if (asking || s.metadata.hasPendingWrites) return; chat = (s.exists && s.data().messages) || []; chatLoaded = true; if (route() === 'conseiller') render(); }, () => {});
  db.doc('agent/memory').onSnapshot(s => { if (s.metadata.hasPendingWrites) return; memo = (s.exists && s.data().notes) || []; }, () => {});
  db.collection('questions').orderBy('at', 'desc').limit(30).onSnapshot(s => { questions = s.docs.map(x => x.data()); if (route() === 'conseiller' && !asking) render(); }, () => {});
  db.collection('alerts').orderBy('date', 'desc').limit(20).onSnapshot(s => { alerts = s.docs.map(x => ({ ...x.data(), id: x.id })); if (['conseiller', 'tableau'].includes(route()) && !asking) render(); }, () => {});
  db.collection('advice').orderBy('date', 'desc').limit(6).onSnapshot(s => { if (asking) return; advice = s.docs.map(x => x.data()); if (route() === 'conseiller') render(); }, () => {});
  db.collection('briefs').orderBy('date', 'desc').limit(12).onSnapshot(s => { briefs = s.docs.map(x => x.data()); if (route() === 'veille') render(); }, () => {});
  db.collection('tx').onSnapshot(s => { txs = s.docs.map(x => ({ ...x.data(), id: x.id })); gotTx = true; done(); }, err => { clearTimeout(timer); setStatus('Erreur : ' + err.code); });
})();
}
</script>
</body>
</html>
